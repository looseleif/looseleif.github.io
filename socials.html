            font-size: 1.5em;
            width: 30px;
            text-align: center;
        }

            color: #fff;
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.3s;
        }

        .contact-methods a:hover {
            opacity: 0.6;
